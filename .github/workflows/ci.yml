name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer le fichier .env
        run: cp .env.example .env
      - name: Build et lancer les services
        run: docker compose up --build -d
      - name: Attendre le démarrage
        run: sleep 15
      - name: Vérifier que l'API répond
        run: curl --fail http://localhost:8000/health
      - name: Arrêter les services
        run: docker compose down